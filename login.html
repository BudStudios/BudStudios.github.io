<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bud Studios — Sign In</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --card:#0f0f0f;
    --text:#ffffff;
    --muted:#9c9c9c;
    --red:#ff2d55;
    --blue:#3b82f6;
    --violet:#a855f7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{scroll-behavior:smooth;}

body{
    background:var(--bg);
    color:white;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    position:relative;
}

/* Animated gradient mesh backdrop */
.mesh{
    position:fixed;
    inset:-20%;
    z-index:-3;
    background:
        radial-gradient(40% 40% at 20% 20%, rgba(255,45,85,.18), transparent 60%),
        radial-gradient(45% 45% at 80% 30%, rgba(59,130,246,.18), transparent 60%),
        radial-gradient(50% 50% at 50% 85%, rgba(168,85,247,.15), transparent 60%);
    filter:blur(40px);
    animation:meshMove 18s ease-in-out infinite alternate;
}

@keyframes meshMove{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-3%,2%) scale(1.08); }
    100%{ transform:translate(3%,-3%) scale(1.03); }
}

/* Noise Overlay */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
    opacity:.03;
    pointer-events:none;
    z-index:999;
}

/* vignette */
body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:998;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%);
}

/* Spotlight */

.spotlight{
    position:fixed;
    width:700px;
    height:700px;
    border-radius:50%;
    background:
    radial-gradient(circle,
    rgba(59,130,246,.14),
    rgba(255,45,85,.09),
    transparent 70%);
    pointer-events:none;
    z-index:0;
    transform:translate(-50%,-50%);
    transition:opacity .3s ease;
    mix-blend-mode:screen;
}

/* Grid */

.grid{
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
}

canvas{
    position:fixed;
    inset:0;
    z-index:-2;
}

/* Floating orbs */
.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    z-index:-1;
    opacity:.5;
    animation:float 12s ease-in-out infinite;
}
.orb1{ width:10px; height:10px; background:var(--blue); top:15%; left:10%; animation-duration:14s; box-shadow:0 0 20px var(--blue); }
.orb2{ width:6px; height:6px; background:var(--red); top:70%; left:85%; animation-duration:10s; box-shadow:0 0 20px var(--red); }
.orb3{ width:8px; height:8px; background:var(--violet); top:80%; left:15%; animation-duration:16s; box-shadow:0 0 20px var(--violet); }
.orb4{ width:5px; height:5px; background:var(--blue); top:25%; left:88%; animation-duration:11s; box-shadow:0 0 15px var(--blue); }

@keyframes float{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(20px,-30px); }
}

.login-logo{
    position:fixed;
    top:30px;
    left:7%;
    font-size:1.5rem;
    font-weight:800;
    text-decoration:none;
    color:white;
    z-index:10;
    letter-spacing:.5px;
    opacity:0;
    animation:dropIn .7s .1s cubic-bezier(.16,1,.3,1) forwards;
}

.login-logo span{
    background:linear-gradient(90deg, var(--red), var(--blue));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    position:relative;
    display:inline-block;
}

.login-logo:hover span{
    animation:glitch .4s steps(2,end) infinite;
}

@keyframes glitch{
    0%{ transform:translate(0,0); text-shadow:2px 0 var(--red), -2px 0 var(--blue); }
    50%{ transform:translate(-1px,1px); text-shadow:-2px 0 var(--red), 2px 0 var(--blue); }
    100%{ transform:translate(0,0); text-shadow:2px 0 var(--blue), -2px 0 var(--red); }
}

@keyframes dropIn{
    from{ opacity:0; transform:translateY(-16px); }
    to{ opacity:1; transform:translateY(0); }
}

.login-card{
    width:100%;
    max-width:420px;
    padding:3px;
    border-radius:25px;
    position:relative;
    z-index:1;
    opacity:0;
    animation:cardIn .8s .15s cubic-bezier(.16,1,.3,1) forwards;
    background:linear-gradient(140deg, rgba(255,255,255,.15), rgba(255,255,255,.02) 40%, rgba(255,255,255,.08));
}

@keyframes cardIn{
    from{ opacity:0; transform:translateY(30px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.login-card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:25px;
    padding:1px;
    background:conic-gradient(from var(--angle,0deg), var(--red), var(--violet), var(--blue), var(--red));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:.55;
    animation:spinBorder 6s linear infinite;
    pointer-events:none;
}

@keyframes spinBorder{
    to{ --angle:360deg; }
}

@property --angle{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
}

.login-card-inner{
    background:rgba(10,10,12,.75);
    border-radius:22px;
    padding:50px 40px;
    backdrop-filter:blur(24px);
    position:relative;
    overflow:hidden;
}

.login-card-inner::before{
    content:"";
    position:absolute;
    top:-60%;
    left:-20%;
    width:140%;
    height:140%;
    background:radial-gradient(circle, rgba(59,130,246,.08), transparent 60%);
    animation:sheen 8s ease-in-out infinite;
    pointer-events:none;
}

@keyframes sheen{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(10%,10%) rotate(20deg); }
}

.login-card h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:2.1rem;
    margin-bottom:8px;
    text-align:center;
    background:linear-gradient(90deg,#fff,#bfbfbf);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:-.5px;
}

.login-card .sub{
    color:var(--muted);
    text-align:center;
    margin-bottom:34px;
    font-size:.95rem;
}

.field{
    position:relative;
    margin-bottom:22px;
}

label{
    position:absolute;
    left:16px;
    top:15px;
    font-size:.95rem;
    color:var(--muted);
    pointer-events:none;
    transition:.2s ease;
    background:transparent;
    padding:0 4px;
}

input{
    width:100%;
    padding:15px 16px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:#fff;
    font-size:1rem;
    font-family:'Inter',sans-serif;
    transition:.25s ease;
    position:relative;
}

input:focus{
    outline:none;
    border-color:var(--blue);
    background:rgba(59,130,246,.06);
    box-shadow:0 0 0 4px rgba(59,130,246,.12), 0 0 20px rgba(59,130,246,.15);
}

input:focus + label,
input:not(:placeholder-shown) + label{
    top:-9px;
    left:12px;
    font-size:.75rem;
    color:var(--blue);
    background:#0f0f10;
    border-radius:6px;
}

.pw-wrap{ position:relative; }

.toggle-pw{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:.8rem;
    letter-spacing:.5px;
    padding:4px 6px;
    border-radius:6px;
    transition:.2s;
    font-weight:600;
    text-transform:uppercase;
}

.toggle-pw:hover{ color:var(--blue); }

.btn-signin{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:1rem;
    color:#fff;
    background:linear-gradient(135deg,var(--red),var(--violet) 50%, var(--blue));
    background-size:200% 200%;
    transition:.35s ease;
    position:relative;
    overflow:hidden;
    letter-spacing:.3px;
}

.btn-signin:hover{
    transform:translateY(-4px);
    background-position:100% 0;
    box-shadow:0 10px 30px -8px rgba(255,45,85,.5), 0 10px 30px -8px rgba(59,130,246,.4);
}

.btn-signin:active{
    transform:translateY(-1px) scale(.98);
}

.btn-signin .btn-label{
    position:relative;
    z-index:2;
    display:inline-flex;
    align-items:center;
    gap:8px;
    justify-content:center;
}

.btn-signin::after{
    content:"";
    position:absolute;
    top:0; left:-75%;
    width:50%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform:skewX(-20deg);
    transition:.6s;
}

.btn-signin:hover::after{
    left:125%;
}

.spinner{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    display:none;
    animation:spin .6s linear infinite;
}

.btn-signin.loading .spinner{ display:inline-block; }
.btn-signin.loading .btn-text{ opacity:.7; }

@keyframes spin{
    to{ transform:rotate(360deg); }
}

.error-msg{
    color:var(--red);
    text-align:center;
    margin-bottom:15px;
    font-size:.88rem;
    min-height:18px;
    font-weight:500;
}

.shake{
    animation:shake .4s;
}

@keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(5px); }
}

.footnote{
    text-align:center;
    margin-top:26px;
    font-size:.78rem;
    color:#555;
}

@media (max-width:480px){
    .login-card-inner{ padding:40px 26px; }
}

</style>
</head>
<body>

<div class="mesh"></div>
<div class="grid"></div>
<div class="spotlight"></div>
<canvas id="particles"></canvas>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>

<a class="login-logo" href="index.html">
    Bud <span>Studios</span>
</a>

<div class="login-card">
  <div class="login-card-inner">

    <h1>Sign In</h1>
    <p class="sub">Authorized personnel only.</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">

        <div class="field">
            <input type="text" id="username" placeholder=" " autocomplete="username" required>
            <label for="username">Username</label>
        </div>

        <div class="field pw-wrap">
            <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
            <label for="password">Password</label>
            <button type="button" class="toggle-pw" id="togglePw">Show</button>
        </div>

        <button type="submit" class="btn-signin" id="submitBtn">
            <span class="btn-label">
                <span class="spinner"></span>
                <span class="btn-text">Sign in</span>
            </span>
        </button>

    </form>

    <p class="footnote">Encrypted session · Bud Studios © 2024</p>

  </div>
</div>

<script>

/* Spotlight */

const spotlight = document.querySelector('.spotlight');

document.addEventListener('mousemove',e=>{
    spotlight.style.left=e.clientX+'px';
    spotlight.style.top=e.clientY+'px';
});

document.addEventListener('mouseleave',()=>{ spotlight.style.opacity=0; });
document.addEventListener('mouseenter',()=>{ spotlight.style.opacity=1; });

/* Particles with constellation connections */

const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
const COUNT = 90;
const LINK_DIST = 130;

for(let i=0;i<COUNT;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.6+0.4,
        dx:(Math.random()-.5)*0.35,
        dy:(Math.random()-.5)*0.35
    });
}

let mouse = { x:-9999, y:-9999 };
document.addEventListener('mousemove', e=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // draw links
    for(let i=0;i<particles.length;i++){
        for(let j=i+1;j<particles.length;j++){
            const a=particles[i], b=particles[j];
            const dx=a.x-b.x, dy=a.y-b.y;
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<LINK_DIST){
                ctx.beginPath();
                ctx.strokeStyle=`rgba(120,150,255,${(1-dist/LINK_DIST)*0.15})`;
                ctx.lineWidth=1;
                ctx.moveTo(a.x,a.y);
                ctx.lineTo(b.x,b.y);
                ctx.stroke();
            }
        }
    }

    particles.forEach(p=>{

        p.x+=p.dx;
        p.y+=p.dy;

        // subtle mouse attraction
        const mdx = mouse.x - p.x;
        const mdy = mouse.y - p.y;
        const mdist = Math.sqrt(mdx*mdx+mdy*mdy);
        if(mdist < 150){
            p.x -= mdx*0.002;
            p.y -= mdy*0.002;
        }

        if(p.x<0)p.x=canvas.width;
        if(p.x>canvas.width)p.x=0;
        if(p.y<0)p.y=canvas.height;
        if(p.y>canvas.height)p.y=0;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.45)";
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

/* Password visibility toggle */

const pwInput = document.getElementById('password');
const togglePw = document.getElementById('togglePw');

togglePw.addEventListener('click', ()=>{
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    togglePw.textContent = isPw ? 'Hide' : 'Show';
});

/* Login validation */

const validUsers = {
    "Bud": "qwerty1234",
    "Shattered": "asdfgh5678"
};

const form = document.getElementById('loginForm');
const card = document.querySelector('.login-card-inner');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e){

    e.preventDefault();

    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    submitBtn.classList.add('loading');

    setTimeout(()=>{

        if(validUsers[u] && validUsers[u] === p){
            localStorage.setItem('budStudiosAuth','true');
            submitBtn.querySelector('.btn-text').textContent = 'Success!';
            window.location.href = 'index.html';
        } else {
            submitBtn.classList.remove('loading');
            errorMsg.textContent = 'Invalid username or password.';
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }

    }, 600);

});

</script>

</body>
</html>
